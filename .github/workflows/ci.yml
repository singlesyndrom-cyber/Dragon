name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kki
          POSTGRES_PASSWORD: kki
          POSTGRES_DB: kki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kki" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://kki:kki@localhost:5432/kki
      JWT_SECRET: ci-secret
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q app
      - name: Import check (API and bot)
        run: python -c "import app.main, app.bot.main, app.bot.auctions"
      - run: pytest -v --tb=short --junitxml=junit.xml
      - if: always()
        run: python ../.github/scripts/junit_annotations.py junit.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log
      - if: failure()
        run: python3 ../.github/scripts/log_annotation.py build.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp .env.example .env
      - name: Build images
        run: |
          set -o pipefail
          docker compose build 2>&1 | tee build.log
      - name: Run the whole stack and open pages
        run: |
          set -o pipefail
          sh .github/scripts/stack_smoke.sh 2>&1 | tee build.log
      - name: Check production compose
        run: |
          set -o pipefail
          docker compose -f docker-compose.prod.yml config -q 2>&1 | tee build.log
          docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" -e SITE_ADDRESS=:80 caddy:2 caddy validate --config /etc/caddy/Caddyfile 2>&1 | tee build.log
      - if: failure()
        run: python3 .github/scripts/log_annotation.py build.log

  scryfall-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true   # внешний сервис: сбой Scryfall не должен блокировать остальное
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Real Scryfall responses match our parser
        env:
          DATABASE_URL: postgresql+asyncpg://x:x@localhost/x
          JWT_SECRET: x
        run: |
          set -o pipefail
          python .github/scripts/scryfall_smoke.py 2>&1 | tee smoke.log
      - if: failure()
        run: python3 .github/scripts/log_annotation.py smoke.log
