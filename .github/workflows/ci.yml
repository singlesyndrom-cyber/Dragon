name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kki
          POSTGRES_PASSWORD: kki
          POSTGRES_DB: kki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kki" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://kki:kki@localhost:5432/kki
      JWT_SECRET: ci-secret
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m compileall -q app
      - run: pytest -v --tb=short --junitxml=junit.xml
      - if: always()
        run: python ../.github/scripts/junit_annotations.py junit.xml
