# Production: наружу открыт только Caddy (80/443, HTTPS-сертификат получает сам).
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: kki
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kki"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kki:${POSTGRES_PASSWORD}@db:5432/kki
    depends_on:
      db: { condition: service_healthy }
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"
    # DNS для выхода в интернет (VK, Scryfall): Docker по умолчанию шлёт запросы на 8.8.8.8/1.1.1.1, а с хостинга
    # они могут не отвечать. Свои серверы - CONTAINER_DNS1 / CONTAINER_DNS2 в .env
    dns: ["${CONTAINER_DNS1:-77.88.8.8}", "${CONTAINER_DNS2:-77.88.8.1}"]
    volumes: ["./backups:/backups:ro", "imgcache:/cache"]   # копии (только чтение) и кэш картинок Scryfall
    restart: unless-stopped

  bot:   # ровно один экземпляр
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://kki:${POSTGRES_PASSWORD}@db:5432/kki
    depends_on:
      db: { condition: service_healthy }
    command: python -m app.bot.main
    # DNS для выхода в интернет (VK, Scryfall): Docker по умолчанию шлёт запросы на 8.8.8.8/1.1.1.1, а с хостинга
    # они могут не отвечать. Свои серверы - CONTAINER_DNS1 / CONTAINER_DNS2 в .env
    dns: ["${CONTAINER_DNS1:-77.88.8.8}", "${CONTAINER_DNS2:-77.88.8.1}"]
    volumes: ["./backups:/backups:ro"]   # бот отправляет облегчённую копию администраторам
    restart: unless-stopped

  backup:   # резервные копии базы каждый день в 04:00 МСК: deploy/backup/README.md
    image: postgres:16
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
    volumes: ["./backups:/backups", "./deploy/backup/run.sh:/run.sh:ro"]
    entrypoint: ["sh", "/run.sh"]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

  tgproxy:   # SSH-туннель до Telegram, если хостер его блокирует: deploy/tgproxy/README.md
    build: ./deploy/tgproxy
    profiles: [tgproxy]
    env_file: .env
    volumes: [./deploy/tgproxy/keys:/keys]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
        NEXT_PUBLIC_TG_BOT_NAME: ${NEXT_PUBLIC_TG_BOT_NAME:-}
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [frontend]
    restart: unless-stopped

volumes:
  imgcache:   # картинки карт Scryfall, скачанные сервером (можно удалить - скачаются заново)
  pgdata:
  caddy_data:
  caddy_config:
