services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: kki
      POSTGRES_PASSWORD: kki
      POSTGRES_DB: kki
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kki"]
      interval: 3s
      retries: 30
  backend:
    build: ./backend
    env_file: .env
    dns: [1.1.1.1, 8.8.8.8, 77.88.8.8]   # явные DNS: в Docker Desktop контейнеры иногда не находят внешние сайты
    depends_on:
      db: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./backend:/srv"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  bot:   # ровно один экземпляр: рассылает очередь outbox и отвечает на команды
    build: ./backend
    env_file: .env
    dns: [1.1.1.1, 8.8.8.8, 77.88.8.8]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./backend:/srv"]
    command: python -m app.bot.main
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
        NEXT_PUBLIC_TG_BOT_NAME: ${NEXT_PUBLIC_TG_BOT_NAME:-}
    environment:
      API_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
    restart: unless-stopped
volumes:
  pgdata:
